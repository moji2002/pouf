name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The site build runs www/scripts/changelog.mjs, which reads
          # `git log -- registry/`. A shallow clone yields one commit, so CI
          # would go green while building a changelog the deploy never
          # produces. deploy.yml already sets this; CI has to match or it is
          # not actually checking the deployed build.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p registry && bunx tsc --noEmit -p gallery
      - name: Unit tests
        run: bun test
      - name: Block dependency check
        # An undeclared import is invisible locally — it resolves fine inside
        # the monorepo — but ships a file that will not compile into the
        # user's project. Nothing else in this pipeline can catch it.
        run: bun run check:deps
      - name: Registry source and directory readiness
        # The build command validates enough to emit JSON, but directory
        # submission has additional rules: a content-free catalog, flat item
        # endpoints, a non-reserved namespace, and source/build parity.
        run: bun run registry:validate
      - name: Install Chromium
        # From gallery/, not the repo root. There is no `playwright` at the
        # root, so a root `bunx playwright` silently downloads the LATEST
        # release and installs that version's browser builds — while gate.ts
        # imports gallery's pinned playwright (^1.61.1) and looks for its own
        # build revision. The install "succeeds" and the gate then dies with
        # "Executable doesn't exist at .../chromium_headless_shell-<rev>".
        # Running it here resolves gallery/node_modules/.bin/playwright, so the
        # installer and the runtime are always the same version.
        run: cd gallery && bunx playwright install --with-deps chromium
      - name: Snapshot gate (computed styles — platform-stable)
        # gate.ts spawns and tears down its own Vite server. This step used to
        # start one first (`bun --cwd gallery dev &` + wait-on); the gate then
        # spawned a second on the same --strictPort, which lost the bind and
        # exited — leaving the run silently dependent on the manual server and
        # racing its shutdown. One owner of the port, no race.
        run: bun run gate -- --json-only
      - name: Registry build
        run: bun run registry:build
      - name: Registry build parity
        # Re-check after generation so a stale committed /r payload cannot pass.
        run: bun run registry:check
      - name: Site build
        run: cd www && bun install && bun run build
